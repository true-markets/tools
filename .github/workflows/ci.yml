name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: python -m py_compile_all || python -c "
          import py_compile, glob, sys
          errors = []
          for f in glob.glob('**/*.py', recursive=True):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print(f'All Python files compiled successfully.')
          "

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truex_market_maker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-external.txt Flake8-pyproject

      - name: black --check
        run: black --check .

      - name: isort --check-only
        run: isort --check-only .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy .
